name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: GameDistribution build (no CrazyGames code inside)
        run: |
          npm run build:gd
          ! grep -qi crazygames dist-gd/index.html
          ! grep -qi gamedistribution dist/index.html
      - name: Level audit (no stationary guards, safe starts, every patrol cycle opens a path)
        run: npm run check:audit
      - name: Playtest bot (solvable; 0 escapes after "!"; 0 sightings in the first 3 s; no camping)
        run: npx tsx scripts/playtest/run.ts --runs 6 --strict
      - name: Check single-file build size (< 10 MB)
        run: test $(stat -c%s dist/index.html) -lt 10000000 && test $(stat -c%s dist-gd/index.html) -lt 10000000

  gamepix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: GamePix build
        run: npm run build:gamepix
      - name: GamePix zip (index.html at the root, gamepix.sdk.js referenced, no CrazyGames / GameDistribution, no other links)
        run: |
          mkdir -p ci-gamepix
          zip -j -9 -X -q ci-gamepix/cookie-heist-gamepix-v1.zip dist-gamepix/index.html
          node scripts/submission/check-gamepix.mjs ci-gamepix/cookie-heist-gamepix-v1.zip
          test $(stat -c%s dist-gamepix/index.html) -lt 10000000
      - name: GamePix legacy handlers + language (GamePix.soundOff= / GamePix.soundOn= / GamePix.lang() in the bundle and the newest zip)
        run: |
          check() {
            grep -qE 'GamePix\.soundOff[[:space:]]*=[^=]' "$1" || { echo "::error::$2: no GamePix.soundOff= assignment"; exit 1; }
            grep -qE 'GamePix\.soundOn[[:space:]]*=[^=]' "$1" || { echo "::error::$2: no GamePix.soundOn= assignment"; exit 1; }
            grep -qE 'GamePix\.lang\(\)' "$1" || { echo "::error::$2: no GamePix.lang() call"; exit 1; }
          }
          check dist-gamepix/index.html dist-gamepix/index.html
          zip=$(ls submission-gamepix/cookie-heist-gamepix-v*.zip | sort -V | tail -n 1)
          unzip -p "$zip" index.html > ci-gamepix/newest.html
          check ci-gamepix/newest.html "$zip"
          node scripts/submission/check-gamepix.mjs "$zip"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run build:gd
      - run: npm run test:e2e:gd
