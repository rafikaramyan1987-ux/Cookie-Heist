name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Locales (every language file has every English key, placeholders, plural forms)
        run: node scripts/check-locales.mjs
      - run: npm test
      - run: npm run build
      - name: GameDistribution build (no CrazyGames code inside)
        run: |
          npm run build:gd
          ! grep -qi crazygames dist-gd/index.html
          ! grep -rqi gamedistribution dist/
      - name: Level audit (no stationary guards, safe starts, every patrol cycle opens a path)
        run: npm run check:audit
      - name: Playtest bot (solvable; 0 escapes after "!"; 0 sightings in the first 3 s; no camping)
        run: npx tsx scripts/playtest/run.ts --runs 6 --strict
      - name: Build sizes (CrazyGames multi-file build < 3 MB in all, GD single file < 10 MB)
        run: test $(du -sb dist | cut -f1) -lt 3000000 && test $(stat -c%s dist-gd/index.html) -lt 10000000
      - name: Web build
        run: npm run build:web

  gamepix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: GamePix build
        run: npm run build:gamepix
      - name: GamePix zip (index.html at the root, gamepix.sdk.js referenced, no CrazyGames / GameDistribution, no other links)
        run: |
          mkdir -p ci-gamepix
          zip -j -9 -X -q ci-gamepix/cookie-heist-gamepix-v2.zip dist-gamepix/index.html
          node scripts/submission/check-gamepix.mjs ci-gamepix/cookie-heist-gamepix-v2.zip
          test $(stat -c%s dist-gamepix/index.html) -lt 10000000
      - name: GamePix legacy hooks + language (GamePix.soundOff= / GamePix.soundOn= / GamePix.lang() in the build and the newest zip)
        run: |
          check() {
            grep -qE 'GamePix\.soundOff[[:space:]]*=([^=]|$)' "$1" || { echo "::error::$2: no GamePix.soundOff= assignment"; exit 1; }
            grep -qE 'GamePix\.soundOn[[:space:]]*=([^=]|$)' "$1" || { echo "::error::$2: no GamePix.soundOn= assignment"; exit 1; }
            grep -qE 'GamePix\.lang\(\)' "$1" || { echo "::error::$2: no GamePix.lang() call"; exit 1; }
          }
          check dist-gamepix/index.html dist-gamepix/index.html
          zip=$(ls submission-gamepix/cookie-heist-gamepix-v*.zip | sort -V | tail -n 1)
          unzip -p "$zip" index.html > ci-gamepix/newest.html
          check ci-gamepix/newest.html "$zip"
          node scripts/submission/check-gamepix.mjs "$zip"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run build:gd
      - run: npm run test:e2e:gd

  crash:
    # zero errors in the CrazyGames build (docs/crash-investigation.md): no uncaught error, no unhandled rejection,
    # no console error, loading always reaches loadingStop — first visit, returning players with v2 / v3 / v3.2 saves,
    # ads (success / error / blocked / no fill), pause, tab hide, resize, WebGL context loss, many nights, slow network
    # and failed downloads, private mode, no WebGL, the official SDK. Every engine, desktop + phone.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - name: The committed CrazyGames zip (newest submission/cookie-heist-v*.zip) is this build
        run: |
          zip=$(ls submission/cookie-heist-v*.zip | sort -V | tail -n 1)
          name=$(basename "$zip" .zip)
          mkdir -p ci-cg && unzip -q -o "$zip" -d ci-cg
          diff -r -x '*.woff' dist "ci-cg/$name" || { echo "::error::$zip is not the current build: run npm run build && npm run submission"; exit 1; }
          echo "OK: $zip == dist"
      - name: Zero errors (${{ matrix.engine }}, desktop + phone)
        run: xvfb-run -a npx playwright test -c playwright.crash.config.ts --project "${{ matrix.engine }}-*" --trace off

  web:
    # open portals (itch.io, Newgrounds, Y8, Playgama): the ad-free web build as a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Web build + zip
        run: npm run build:web && node scripts/web/zip.mjs ci-web/cookie-heist-web.zip
      - name: Web zip checks (index.html at the root, no crazygames / gamedistribution / gamepix / googlesyndication, no http(s) request at runtime, iframe 640x480 / 960x600 / 1280x720 / 390x844, first level played)
        run: node scripts/web/check.mjs ci-web/cookie-heist-web.zip --shots ci-web/checks
      - name: Committed zip (submission-web/cookie-heist-web-v2.zip) passes the same file checks
        run: node scripts/web/check.mjs submission-web/cookie-heist-web-v2.zip --static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-zip-checks
          path: ci-web/

  playgama:
    # Playgama: Playgama Bridge from Playgama's CDN, initialized before the game bundle runs, as a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playgama build
        run: npm run build:playgama
      - name: Playgama build calls bridge.initialize() before the game bundle and sends the documented game_ready
        run: |
          f=dist-playgama/index.html
          head -c 400 $f | grep -qF '<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>' || { echo "$f: Bridge CDN script is not the first script in <head>"; exit 1; }
          grep -qF 'window.bridge.initialize()' $f || { echo "$f: no bridge.initialize() call"; exit 1; }
          grep -qF '<script type="text/plain" data-playgama-game' $f || { echo "$f: game bundle not held until bridge.initialize() settles"; exit 1; }
          ! grep -q '<script type="module"' $f || { echo "$f: a module script runs before bridge.initialize() settles"; exit 1; }
          grep -qF 'console.error(' $f || { echo "$f: initialize failure would be silent"; exit 1; }
          cat dist-playgama/assets/*.js > dist-playgama-game.js
          grep -qE "[\"'\`]game_ready[\"'\`]" dist-playgama-game.js || { echo "dist-playgama: no game_ready message"; exit 1; }
          grep -qF '.sendMessage(' dist-playgama-game.js || { echo "dist-playgama: no platform.sendMessage call"; exit 1; }
          echo "OK: $f initializes Bridge first and the game sends game_ready"
      - name: Playgama zip checks (index.html at the root, CDN Bridge first in <head>, initialize() before the game, game_ready, no crazygames / gamedistribution / gamepix, Playgama's precheck with no FAIL / WARN)
        run: node scripts/playgama/zip.mjs ci-playgama/cookie-heist-playgama.zip && node scripts/playgama/check.mjs ci-playgama/cookie-heist-playgama.zip
      - name: Committed zip (submission-playgama/cookie-heist-playgama-v3.zip) passes the same checks
        run: node scripts/playgama/check.mjs submission-playgama/cookie-heist-playgama-v3.zip
      - name: Playgama QA Tool harness (?platform_id=qa_tool; Bridge's initialize handshake, game_ready; failures logged, game playable)
        run: |
          node scripts/playgama/qa.mjs ci-playgama/cookie-heist-playgama.zip
          node scripts/playgama/qa.mjs submission-playgama/cookie-heist-playgama-v3.zip
      - name: Bridge test (mock platform + stubbed Playgama SDK; interstitial, rewarded completed / cancelled, muted during ads)
        run: node scripts/playgama/test.mjs ci-playgama/cookie-heist-playgama.zip
      - name: The other builds never contain Playgama Bridge
        run: |
          npm run build
          npm run build:gd
          npm run build:web
          npm run build:gamepix
          for f in dist dist-gd dist-web dist-gamepix; do if grep -rq -e playgama-bridge -e bridge.playgama.com $f || test -e $f/playgama-bridge.js; then echo "$f has Playgama Bridge"; exit 1; fi; done

  title-layout:
    # the title logo never overlaps the menu buttons and every button is on screen, in every build, at
    # 1280x720, 1366x768, 1920x1080, 844x390 and 390x844
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build every platform
        run: npm run build && npm run build:gd && npm run build:web && npm run build:gamepix && npm run build:playgama
      - name: Title layout (CrazyGames, GD, web, GamePix, Playgama)
        run: for d in dist dist-gd dist-web dist-gamepix dist-playgama; do node scripts/title-layout.mjs "$d" || exit 1; done

  gamemonetize:
    # GameMonetize: window.SDK_OPTIONS + api.gamemonetize.com/sdk.js loaded once at boot; interstitials only at natural
    # breaks; no rewarded ads (the SDK has none); a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: GameMonetize adapter unit test (pause + mute, resume, settles once, no rewarded)
        run: npx vitest run tests/unit/gamemonetize.test.ts
      - name: GameMonetize build
        run: npm run build:gamemonetize
      - name: GameMonetize zip checks (index.html at the root, relative paths, only sdk.js external, game ID, no other portal SDK, images 512x384 / 512x512 / 512x340 JPEG < 300 KB)
        run: node scripts/gamemonetize/zip.mjs ci-gamemonetize/cookie-heist-gamemonetize.zip
      - name: Committed zip (submission-gamemonetize/cookie-heist-gamemonetize-v2.zip) passes the same checks
        run: node scripts/gamemonetize/check.mjs submission-gamemonetize/cookie-heist-gamemonetize-v2.zip
      - name: Playwright smoke test of dist-gamemonetize (stubbed SDK; loads, Play, ad pauses + mutes, no rewarded buttons, no console errors)
        run: npm run test:e2e:gamemonetize
      - name: Title layout (GameMonetize)
        run: node scripts/title-layout.mjs dist-gamemonetize
      - name: The other builds never contain the GameMonetize SDK
        run: |
          npm run build
          npm run build:gd
          npm run build:web
          npm run build:gamepix
          npm run build:playgama
          for f in dist dist-gd dist-web dist-gamepix dist-playgama; do if grep -rqi -e gamemonetize -e p4y3j0gzsj1efndrh21up9ji7ykxjyo8 $f; then echo "$f has GameMonetize code"; exit 1; fi; done

  y8:
    # Y8: y8.min.js from Y8's CDN (async, never bundled), initialized as the portal snippet; start / next interstitials
    # only from clicks, rewarded only after adViewed; pause + mute on hidden / blur; a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Media tools (ffprobe for the videos, ImageMagick identify for the images)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg imagemagick
      - name: Y8 adapter unit test (beforeAd / afterAd, settles once, reward only on adViewed, visibility / blur pause)
        run: npx vitest run tests/unit/y8.test.ts
      - name: Y8 build
        run: npm run build:y8
      - name: Y8 zip + media checks (index.html at the root, relative paths, CDN SDK async in <head>, no bundled SDK, no other ad network; every media file at its exact size and limit)
        run: node scripts/y8/zip.mjs ci-y8/cookie-heist-y8.zip
      - name: Committed zip (submission-y8/cookie-heist-y8-v2.zip) passes the same checks
        run: node scripts/y8/check.mjs submission-y8/cookie-heist-y8-v2.zip
      - name: Playwright smoke test of dist-y8 (stubbed SDK; loads, no ad before init, Play, rewarded, ad blocker, no console errors)
        run: npm run test:e2e:y8
      - name: Title layout (Y8)
        run: node scripts/title-layout.mjs dist-y8
      - name: The other builds never contain the Y8 SDK
        run: |
          npm run build
          npm run build:gd
          npm run build:web
          npm run build:gamepix
          npm run build:playgama
          npm run build:gamemonetize
          for f in dist dist-gd dist-web dist-gamepix dist-playgama dist-gamemonetize; do if grep -rqi -e cdn.y8.com -e y8sdk -e 6af4a2c63c0f1c5e7ad8dc57 $f; then echo "$f has Y8 code"; exit 1; fi; done
